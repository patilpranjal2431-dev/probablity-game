<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edge Lab — Sign In</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="auth">
    <main class="auth-shell">
      <div class="brand">
        <h1>Edge Lab</h1>
        <p>Virtual-coin quantitative decision platform (no real money).</p>
      </div>

      <section class="card">
        <div class="tabs" role="tablist">
          <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true">
            Sign In
          </button>
          <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false">
            Register
          </button>
        </div>

        <div id="auth-error" class="error-banner hidden" role="alert"></div>

        <form id="login-form">
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <form id="register-form" class="hidden">
          <div class="field">
            <label for="reg-username">Username</label>
            <input
              id="reg-username"
              name="username"
              type="text"
              autocomplete="username"
              minlength="3"
              maxlength="32"
              pattern="[a-zA-Z0-9_]+"
              required
            />
            <div class="hint">3–32 characters: letters, numbers, or underscores.</div>
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input id="reg-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input
              id="reg-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            />
            <div class="hint">Minimum 8 characters. Starts with 1,000 virtual coins.</div>
          </div>
          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
      </section>
      <p class="hint" style="text-align: center; margin-top: 1rem;">
        Explore without signing in:
        <a href="/docs" class="nav-link">Algorithm Docs</a> &middot;
        <a href="/lab" class="nav-link">Quant Lab</a> &middot;
        <a href="/bankroll" class="nav-link">Bankroll Simulator</a> &middot;
        <a href="/leaderboard" class="nav-link">Leaderboards</a>
      </p>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
